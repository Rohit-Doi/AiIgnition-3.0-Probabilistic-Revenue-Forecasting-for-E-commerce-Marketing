# Light theme at start-up. The in-app "Dark mode" switch swaps these at run time (src/theme.py).
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f5f7fa"
secondaryBackgroundColor = "#eaeef4"
textColor = "#0b0b0b"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
